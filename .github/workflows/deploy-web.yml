name: Deploy Web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'index.json'
      - 'skills_index.json'
      - 'mappings/attack-navigator-layer.json'
      - '.gitmodules'
      - '.github/workflows/deploy-web.yml'
  # Release 工作流用 GITHUB_TOKEN 提交版本号，这类提交不会触发 push 事件，
  # 导致站点数据/版本号一直停留在上一次人工推送的状态 —— 用 workflow_run 接住。
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "deploy-web"
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Refresh external skills manifest
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 用 API 模式按 .gitmodules 固定 commit 现算外部 SKILL.md / markdown 计数，
          # 这样新加的子仓库不必等周报 PR 就能在站点显示数量；失败则沿用已提交的清单。
          python3 tools/external_skills_manifest.py --api \
            || echo "::warning::外部技能清单刷新失败，沿用已提交的 external-skills.json"

      - name: Sync data files
        run: node scripts/sync-data.mjs

      - name: Build
        run: npx next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
