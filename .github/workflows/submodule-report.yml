# 子仓库状态汇总报告
# 收集所有子仓库的信息（版本、描述、最近更新），生成综合报告并推送到仓库

name: Submodule Report

on:
  schedule:
    # 每周一和周四生成报告
    - cron: '0 10 * * 1,4'
  workflow_dispatch:
  repository_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          recursive: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Generate comprehensive report
        run: |
          python3 << 'PYEOF'
          import os
          import re
          import subprocess
          import json
          from datetime import datetime

          repo_root = '.'

          def get_submodule_info(path, url):
              info = {'path': path, 'url': url, 'status': 'unknown'}
              try:
                  # 获取当前 commit
                  result = subprocess.run(
                      ['git', 'rev-parse', 'HEAD'],
                      capture_output=True, text=True,
                      cwd=os.path.join(repo_root, path)
                  )
                  info['commit'] = result.stdout.strip()[:7] if result.returncode == 0 else 'N/A'

                  # 获取远程最新
                  subprocess.run(['git', 'fetch', '--quiet', 'origin'],
                               cwd=os.path.join(repo_root, path),
                               capture_output=True)

                  # 尝试 main 分支
                  result = subprocess.run(
                      ['git', 'rev-parse', 'origin/main'],
                      capture_output=True, text=True,
                      cwd=os.path.join(repo_root, path)
                  )
                  if result.returncode != 0:
                      result = subprocess.run(
                          ['git', 'rev-parse', 'origin/master'],
                          capture_output=True, text=True,
                          cwd=os.path.join(repo_root, path)
                      )
                  info['remote_commit'] = result.stdout.strip()[:7] if result.returncode == 0 else 'N/A'

                  # 检查是否落后
                  if info.get('commit') != info.get('remote_commit') and info.get('remote_commit') != 'N/A':
                      info['status'] = 'behind'
                  else:
                      info['status'] = 'synced'

                  # 获取 README 描述
                  for readme in ['README.md', 'README_zh.md', 'README_EN.md']:
                      readme_path = os.path.join(repo_root, path, readme)
                      if os.path.exists(readme_path):
                          with open(readme_path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()[:500]
                              title_match = re.search(r'#\s+(.+)', content)
                              if title_match:
                                  info['description'] = title_match.group(1).strip()
                                  break

                  # 获取 GitHub stars
                  if 'github.com' in url:
                      match = re.search(r'github\.com[/:](.+?)(?:\.git)?$', url)
                      if match:
                          repo = match.group(1)
                          try:
                              import requests
                              resp = requests.get(
                                  f"https://api.github.com/repos/{repo}",
                                  timeout=5
                              )
                              if resp.status_code == 200:
                                  data = resp.json()
                                  info['stars'] = data.get('stargazers_count', 0)
                                  info['forks'] = data.get('forks_count', 0)
                                  info['language'] = data.get('language', 'N/A')
                          except:
                              pass
              except Exception as e:
                  info['status'] = 'error'
              return info

          # 解析 .gitmodules
          submodules = []
          current_section = None

          with open('.gitmodules', 'r') as f:
              for line in f:
                  section_match = re.match(r'\[submodule\s+"([^"]+)"\]', line)
                  if section_match:
                      current_section = section_match.group(1)
                      submodules.append({'path': current_section})
                  elif '=' in line and current_section:
                      key, value = line.split('=', 1)
                      submodules[-1][key.strip()] = value.strip()

          # 收集每个子模块信息
          all_info = []
          for sm in submodules:
              if 'url' in sm and 'path' in sm:
                  info = get_submodule_info(sm['path'], sm['url'])
                  all_info.append(info)

          # 生成报告
          now = datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')
          synced = sum(1 for i in all_info if i['status'] == 'synced')
          behind = sum(1 for i in all_info if i['status'] == 'behind')

          lines = [
              "# 📦 子仓库状态汇总报告",
              "",
              f"> 生成时间: {now}",
              "> 仓库: [anonymous99-Rise/multi-CyberSecurity](https://github.com/anonymous99-Rise/multi-CyberSecurity)",
              "",
              "## 📊 概览",
              "",
              "| 指标 | 值 |",
              "|------|-----|",
              f"| 子仓库总数 | {len(all_info)} |",
              f"| 同步正常 | {synced} |",
              f"| 落后远程 | {behind} |",
              "",
              "---",
              "",
              "## 📁 子仓库详情",
              "",
              "| 名称 | 描述 | 当前 | 远程 | Stars | 状态 |",
              "|------|------|------|------|-------|------|",
          ]

          for info in all_info:
              icon = '✅' if info['status'] == 'synced' else '🔄' if info['status'] == 'behind' else '❌'
              desc = info.get('description', 'N/A')[:40]
              stars = info.get('stars', 'N/A')
              lines.append(
                  f"| `{info['path']}` | {desc} | `{info.get('commit', 'N/A')}` | "
                  f"`{info.get('remote_commit', 'N/A')}` | {stars} | {icon} |"
              )

          lines.extend([
              "",
              "---",
              "",
              "## 🔧 子仓库目录结构",
              "",
              "```",
          ])
          for info in all_info:
              lines.append(f"├── {info['path']}/")
          lines.extend([
              "```",
              "",
              "---",
              "",
              "*🤖 由 GitHub Actions 自动生成*",
          ])

          with open('SUBMODULE_REPORT.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(lines))

          print(f"报告已生成: {len(all_info)} 个子仓库, {synced} 同步, {behind} 落后")
          PYEOF

      - name: Commit report to repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet HEAD -- SUBMODULE_REPORT.md; then
            echo "报告无变化，不需更新"
          else
            BRANCH="docs/submodule-report-$(date +%Y%m%d)"
            git checkout -b "$BRANCH"
            git add SUBMODULE_REPORT.md
            git commit -m "docs: update submodule status report

            Auto-generated submodule status report
            Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

            Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push origin "$BRANCH" || echo "推送失败"

            gh pr create \
              --repo anonymous99-Rise/multi-CyberSecurity \
              --head "$BRANCH" \
              --base main \
              --title "docs: submodule status report $(date +%Y-%m-%d)" \
              --body "自动生成的子仓库状态汇总报告" \
              --fill || echo "PR 创建失败"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: submodule-full-report
          path: SUBMODULE_REPORT.md
          retention-days: 30
