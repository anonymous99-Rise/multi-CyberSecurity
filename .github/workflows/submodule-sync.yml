# 子仓库定时同步工作流
# 每周自动更新所有子仓库到最新版本，并生成同步报告

name: Submodule Sync

on:
  schedule:
    # 每周一早上 8:00 自动同步
    - cron: '0 8 * * 1'
  workflow_dispatch:
  # PR 事件触发（只合并，不创建）
  pull_request:
    types: [opened, synchronize, closed]
  # main 分支 push 时触发（检查并合并已有 PR）
  push:
    branches:
      - main

jobs:
  # 完整同步流程（schedule / workflow_dispatch 触发）
  full-sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 初始化子模块
        run: |
          git submodule init
          git submodule status | awk '{print $2}' > submodule-paths.txt

      - name: 同步到最新远程
        run: |
          echo "同步所有子模块到最新..."
          git submodule update --remote --recursive

      - name: 检查变更
        id: check_changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ 所有子模块已是最新，无需更新"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git diff --stat
          fi

      - name: 创建同步提交
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_commit
        run: |
          BRANCH="submodule-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "chore: sync submodules to latest

          - Updated submodules to latest remote versions
          - Generated by GitHub Actions
          - Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: 查找或创建 PR
        if: steps.check_changes.outputs.has_changes == 'true'
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 查找已有的 submodule-update PR
          EXISTING=$(gh pr list \
            --repo anonymous99-Rise/multi-CyberSecurity \
            --label "submodule-update" \
            --state "open" \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            echo "发现已有 open PR #$EXISTING"
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "has_pr=true" >> $GITHUB_OUTPUT
          else
            echo "没有发现 open PR，创建新 PR"
            echo "has_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: 创建新 PR
        if: steps.check_changes.outputs.has_changes == 'true' && steps.find_pr.outputs.has_pr == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.create_commit.outputs.branch }}"

          # 创建 label
          gh label create "submodule-update" \
            --description "子仓库同步更新" \
            --repo anonymous99-Rise/multi-CyberSecurity \
            2>/dev/null || true

          # 创建 PR
          PR_URL=$(gh pr create \
            --repo anonymous99-Rise/multi-CyberSecurity \
            --head "$BRANCH" \
            --base main \
            --title "chore: sync submodules to latest" \
            --body "自动同步的子仓库更新" \
            --fill)

          echo "PR created: $PR_URL"
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # 添加 label
          gh pr edit "$PR_URL" --add-label "submodule-update"

      - name: 合并 PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
          echo "处理 PR #$PR_NUMBER"

          # 等待 CI
          echo "等待 CI 检查..."
          gh pr wait "$PR_NUMBER" --interval 10 --timeout 300 || echo "等待超时"

          # 合并并删除分支
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --repo anonymous99-Rise/multi-CyberSecurity

          echo "✅ PR #$PR_NUMBER 已合并"

      - name: 无变更
        if: steps.check_changes.outputs.has_changes != 'true'
        run: echo "✅ 所有子模块已是最新版本"

  # 仅合并流程（PR / push 触发时）
  merge-only:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 查找 submodule-update PR
        id: find_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "事件: ${{ github.event_name }}"
          echo "PR 编号: ${{ github.event.pull_request.number }}"

          # 检查是否是 PR closed 事件
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PR_STATE="${{ github.event.action }}"
            echo "PR #$PR_NUMBER 状态: $PR_STATE"

            if [[ "$PR_STATE" == "closed" ]]; then
              echo "PR 已关闭，跳过合并"
              echo "has_pr=false" >> $GITHUB_OUTPUT
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          # 查找 open 的 submodule-update PR
          EXISTING=$(gh pr list \
            --repo anonymous99-Rise/multi-CyberSecurity \
            --label "submodule-update" \
            --state "open" \
            --json number \
            --jq '.[0].number' 2>/dev/null)

          if [[ -n "$EXISTING" && "$EXISTING" != "null" ]]; then
            echo "发现 open PR #$EXISTING"
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
            echo "has_pr=true" >> $GITHUB_OUTPUT
          else
            echo "没有发现 open PR"
            echo "has_pr=false" >> $GITHUB_OUTPUT
          fi

      - name: 合并 PR
        if: steps.find_pr.outputs.has_pr == 'true' && steps.find_pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER="${{ steps.find_pr.outputs.pr_number }}"
          echo "合并 PR #$PR_NUMBER"

          # 等待 CI
          echo "等待 CI 检查..."
          gh pr wait "$PR_NUMBER" --interval 10 --timeout 300 || echo "等待超时"

          # 合并并删除分支
          gh pr merge "$PR_NUMBER" \
            --squash \
            --delete-branch \
            --repo anonymous99-Rise/multi-CyberSecurity

          echo "✅ PR #$PR_NUMBER 已合并"

      - name: 跳过合并
        if: steps.find_pr.outputs.skip == 'true' || steps.find_pr.outputs.has_pr == 'false'
        run: |
          echo "跳过合并步骤"
