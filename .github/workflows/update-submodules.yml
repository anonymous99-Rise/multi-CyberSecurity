# 子模块手动更新工作流
# 需要更新时在 GitHub Actions 页面手动触发
# 也可通过 repository_dispatch 触发: curl -X POST https://api.github.com/repos/anonymous99-Rise/multi-CyberSecurity/dispatches -H "Accept: application/vnd.github.v3+json" -H "Authorization: token $TOKEN" -d '{"event_type":"update-submodules"}'

name: Update Submodules (Manual)

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Commit message'
        required: false
        default: 'chore: update submodules'
      target:
        description: 'Target submodule (leave empty for all)'
        required: false
        default: ''
  repository_dispatch:
    types: [update-submodules]

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false  # 手动控制
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Initialize submodules
        run: git submodule init

      - name: Update to latest remote
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [[ -n "$TARGET" ]]; then
            echo "更新指定子模块: $TARGET"
            git submodule update --remote --force "$TARGET"
          else
            echo "更新所有子模块"
            git submodule update --remote --recursive
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "✅ 所有子模块已是最新，无需更新"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "发现需要更新的子模块"
            git diff --stat
          fi

      - name: Create commit and push
        if: steps.check_changes.outputs.has_changes == 'true'
        id: create_commit
        run: |
          BRANCH="update-submodules-$(date +%s)"
          git checkout -b "$BRANCH"
          git add .
          git commit -m "${{ github.event.inputs.message || 'chore: update submodules' }}

          - Updated submodules to latest remote versions
          - Generated by GitHub Actions

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 确保 label 存在（幂等）
          gh label create "submodule-update" \
            --description "子仓库同步更新" \
            --repo anonymous99-Rise/multi-CyberSecurity 2>/dev/null || true

          PR_URL=$(gh pr create \
            --repo anonymous99-Rise/multi-CyberSecurity \
            --head "${{ steps.create_commit.outputs.branch }}" \
            --base main \
            --title "${{ github.event.inputs.message || 'chore: update submodules' }}" \
            --body "Automated submodule update triggered manually" \
            --fill)
          echo "PR created: $PR_URL"

          # 添加 label（带重试以避免 PR 刚创建时同步延迟）
          for i in 1 2 3; do
            if gh pr edit "$PR_URL" --add-label "submodule-update" \
               --repo anonymous99-Rise/multi-CyberSecurity; then
              echo "Label added successfully"
              break
            else
              echo "Attempt $i failed, retrying in 5s..."
              sleep 5
            fi
          done
